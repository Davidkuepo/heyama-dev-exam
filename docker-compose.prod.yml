version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: heyama-mongo-prod
    environment:
      MONGO_INITDB_DB: heyama
    volumes:
      - mongo_data_prod:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heyama-backend-prod
    environment:
      MONGODB_URI: mongodb://mongo:27017/heyama
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: heyama-frontend-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data_prod:
    driver: local
