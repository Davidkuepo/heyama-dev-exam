version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: heyama-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: heyama-dev
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - heyama-network

  mongo-express:
    image: mongo-express:latest
    container_name: heyama-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - heyama-network

volumes:
  mongodb_data:
  mongodb_config:

networks:
  heyama-network:
    driver: bridge
