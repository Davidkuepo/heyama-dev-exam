services:
  - type: web
    name: heyama-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        fromDatabase:
          name: heyama-mongo
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: heyama-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://heyama-backend.onrender.com

  - type: pserv
    name: heyama-mongo
    plan: free
